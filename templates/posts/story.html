{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stories • InstaLite</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >


    <style>
/* =========================================================
   INSTALITE STORIES — PREMIUM GRADIENT THEME
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at 8% 8%,
            rgba(219, 39, 119, 0.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 92% 10%,
            rgba(124, 58, 237, 0.15),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 95%,
            rgba(8, 145, 178, 0.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f3edff 0%,
            #eef5ff 45%,
            #fff0f8 100%
        );

    background-attachment: fixed;

    color: #302442;
}


/* =========================================================
   STORIES CONTAINER
========================================================= */

.stories-container {
    width: 100%;
    max-width: 1000px;

    margin: 20px auto;

    padding: 0 15px 40px;
}


/* =========================================================
   STORIES TITLE
========================================================= */

.stories-title {
    font-size: 22px;
    font-weight: 700;

    margin-bottom: 22px;

    color: #55218a;

    letter-spacing: -0.4px;
}


/* =========================================================
   STORIES GRID
========================================================= */

.stories-grid {
    display: flex;
    flex-wrap: wrap;

    gap: 18px;
}


/* =========================================================
   STORY CARD
========================================================= */

.story-card {
    width: 150px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.96),
            rgba(244, 232, 255, 0.95),
            rgba(230, 243, 255, 0.95)
        );

    border: 1px solid rgba(124, 58, 237, 0.16);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 8px 24px rgba(91, 33, 182, 0.10),
        0 3px 8px rgba(219, 39, 119, 0.06);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.story-card:hover {
    transform: translateY(-5px);

    border-color: rgba(219, 39, 119, 0.35);

    box-shadow:
        0 14px 30px rgba(91, 33, 182, 0.16),
        0 5px 14px rgba(219, 39, 119, 0.10);
}


/* =========================================================
   STORY IMAGE
========================================================= */

.story-image {
    width: 100%;
    height: 190px;

    object-fit: cover;

    display: block;

    background:
        linear-gradient(
            135deg,
            #e9d5ff,
            #fbcfe8,
            #bae6fd
        );

    transition: transform 0.35s ease;
}

.story-card:hover .story-image {
    transform: scale(1.03);
}


/* =========================================================
   USER INFORMATION
========================================================= */

.story-user {
    display: flex;
    align-items: center;

    gap: 8px;

    padding: 10px;

    background:
        linear-gradient(
            120deg,
            rgba(243, 232, 255, 0.95),
            rgba(255, 240, 248, 0.95),
            rgba(224, 242, 254, 0.95)
        );
}


/* =========================================================
   PROFILE PHOTO
========================================================= */

.story-profile-photo,
.story-profile-placeholder {
    width: 32px;
    height: 32px;

    min-width: 32px;
    min-height: 32px;

    border-radius: 50%;

    object-fit: cover;

    flex-shrink: 0;
}

.story-profile-photo {
    border: 2px solid #ffffff;

    outline: 2px solid #c026d3;

    box-shadow:
        0 2px 8px rgba(124, 58, 237, 0.20);
}


/* =========================================================
   PROFILE PLACEHOLDER
========================================================= */

.story-profile-placeholder {
    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #db2777,
            #0891b2
        );

    color: #ffffff;

    font-size: 13px;
    font-weight: 700;

    box-shadow:
        0 3px 9px rgba(124, 58, 237, 0.20);
}


/* =========================================================
   USERNAME
========================================================= */

.story-username {
    min-width: 0;

    font-size: 13px;
    font-weight: 700;

    color: #4c1d72;

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   EMPTY STORIES MESSAGE
========================================================= */

.no-stories {
    width: 100%;

    text-align: center;

    padding: 50px 20px;

    border: 1px solid rgba(124, 58, 237, 0.14);

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.78),
            rgba(243, 232, 255, 0.85),
            rgba(224, 242, 254, 0.80)
        );

    color: #76558f;

    box-shadow:
        0 8px 25px rgba(91, 33, 182, 0.07);
}


/* =========================================================
   RESPONSIVE DESIGN
========================================================= */

@media (max-width: 600px) {
    .stories-container {
        margin: 16px auto;

        padding: 0 12px 30px;
    }

    .stories-title {
        font-size: 20px;

        margin-bottom: 18px;
    }

    .stories-grid {
        gap: 10px;
    }

    .story-card {
        width: calc(50% - 5px);

        border-radius: 16px;
    }

    .story-image {
        height: 210px;
    }

    .story-user {
        padding: 9px;
    }

    .story-username {
        font-size: 12px;
    }
}


/* =========================================================
   SMALL MOBILE SCREENS
========================================================= */

@media (max-width: 360px) {
    .story-image {
        height: 175px;
    }

    .story-profile-photo,
    .story-profile-placeholder {
        width: 28px;
        height: 28px;

        min-width: 28px;
        min-height: 28px;
    }

    .story-user {
        gap: 7px;
        padding: 8px;
    }
}

    </style>

</head>


<body>


<div class="stories-container">


    <div class="stories-title">

        Stories

    </div>


    {% if stories %}


        <div class="stories-grid">


            {% for story in stories %}


                <div class="story-card">


                    <!-- STORY IMAGE -->

                    {% if story.image %}

                        <img
                            src="{{ story.image.url }}"
                            class="story-image"
                            alt="Story"
                        >

                    {% endif %}


                    <!-- USER + PROFILE PICTURE -->

                    <div class="story-user">


                        {% if story.user.profile_picture %}

                            <img
                                src="{{ story.user.profile_picture.url }}"
                                class="story-profile-photo"
                                alt="{{ story.user.username }}"
                            >

                        {% else %}

                            <div
                                class="story-profile-placeholder"
                            >

                                <i
                                    class="fa-solid fa-user"
                                ></i>

                            </div>

                        {% endif %}


                        <span class="story-username">

                            {{ story.user.full_name|default:story.user.username }}

                        </span>


                    </div>


                </div>


            {% endfor %}


        </div>


    {% else %}


        <div class="no-stories">

            No active stories.

        </div>


    {% endif %}


</div>


</body>

</html>
