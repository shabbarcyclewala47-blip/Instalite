{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile • InstaLite</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #262626;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(225, 48, 108, 0.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(131, 58, 180, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #fafafa,
                    #f5f1f7,
                    #fafafa
                );
        }


        /* ================================================
           CONTAINER
        ================================================ */

        .edit-container {

            max-width: 600px;

            margin: 40px auto;

            padding:
                0 20px 50px;
        }


        /* ================================================
           CARD
        ================================================ */

        .edit-card {

            background:
                rgba(255, 255, 255, 0.92);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.8);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, 0.08);
        }


        /* ================================================
           TITLE
        ================================================ */

        .page-title {

            text-align: center;

            font-size: 25px;

            font-weight: 600;

            margin-bottom: 30px;
        }


        /* ================================================
           PHOTO
        ================================================ */

        .photo-area {

            text-align: center;

            margin-bottom: 30px;
        }


        .photo-wrapper {

            position: relative;

            width: 120px;

            height: 120px;

            margin: auto;
        }


        .current-photo {

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border:
                4px solid white;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.15);
        }


        .default-photo {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ddd,
                    #f5f5f5
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 45px;

            color: #aaa;

            border:
                4px solid white;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.15);
        }


        .photo-change-button {

            display: inline-block;

            margin-top: 15px;

            color: #0095f6;

            font-weight: 600;

            font-size: 14px;

            cursor: pointer;
        }


        .photo-change-button:hover {

            color: #0077c8;
        }


        #profile_picture {

            display: none;
        }


        /* ================================================
           FORM
        ================================================ */

        .form-group {

            margin-bottom: 22px;
        }


        .form-label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .form-control {

            width: 100%;

            border:
                1px solid #ddd;

            border-radius: 11px;

            padding:
                12px 14px;

            font-size: 14px;

            background: #fff;

            box-shadow: none;
        }


        .form-control:focus {

            border-color: #999;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.04);

            outline: none;
        }


        textarea.form-control {

            min-height: 110px;

            resize: vertical;
        }


        .help-text {

            display: block;

            margin-top: 6px;

            color: #888;

            font-size: 12px;
        }


        /* ================================================
           BUTTONS
        ================================================ */

        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 30px;
        }


        .save-button,
        .cancel-button {

            flex: 1;

            min-height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;
        }


        .save-button {

            border: none;

            background: #262626;

            color: white;
        }


        .save-button:hover {

            background: #444;

            color: white;
        }


        .cancel-button {

            background: #eeeeee;

            color: #262626;
        }


        .cancel-button:hover {

            background: #dddddd;

            color: #262626;
        }


        /* ================================================
           MESSAGES
        ================================================ */

        .message {

            border-radius: 10px;

            font-size: 14px;

            margin-bottom: 20px;
        }


        /* ================================================
           MOBILE
        ================================================ */

        @media (max-width: 600px) {

            .edit-container {

                margin: 20px auto;

                padding:
                    0 12px 30px;
            }


            .edit-card {

                padding:
                    25px 18px;

                border-radius: 20px;
            }


            .page-title {

                font-size: 22px;
            }


            .buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="edit-container">


    <div class="edit-card">


        <!-- =============================================
             TITLE
        ============================================== -->

        <div class="page-title">

            Edit Profile

        </div>


        <!-- =============================================
             MESSAGES
        ============================================== -->

        {% if messages %}

            {% for message in messages %}

                <div
                    class="alert alert-{{ message.tags }} message"
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- =============================================
             FORM
        ============================================== -->

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- =========================================
                 PROFILE PHOTO
            ========================================== -->

            <div class="photo-area">


                <div class="photo-wrapper">


                    {% if profile_user.profile_picture %}

                        <img
                            src="{{ profile_user.profile_picture.url }}"
                            class="current-photo"
                            id="preview"
                            alt="Profile Picture"
                        >

                    {% else %}

                        <div
                            class="default-photo"
                            id="defaultPreview"
                        >

                            <i class="fa-solid fa-user"></i>

                        </div>


                        <img
                            src=""
                            class="current-photo"
                            id="preview"
                            style="display:none;"
                            alt="Profile Picture"
                        >

                    {% endif %}


                </div>


                <label
                    for="profile_picture"
                    class="photo-change-button"
                >

                    <i class="fa-solid fa-camera"></i>

                    Change Profile Photo

                </label>


                <input
                    type="file"
                    name="profile_picture"
                    id="profile_picture"
                    accept="image/*"
                >


            </div>


            <!-- =========================================
                 USERNAME
            ========================================== -->

            <div class="form-group">

                <label
                    for="username"
                    class="form-label"
                >

                    Username

                </label>


                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    value="{{ profile_user.username }}"
                    maxlength="30"
                    required
                >

            </div>


            <!-- =========================================
                 FULL NAME
            ========================================== -->

            <div class="form-group">

                <label
                    for="full_name"
                    class="form-label"
                >

                    Full Name

                </label>


                <input
                    type="text"
                    name="full_name"
                    id="full_name"
                    class="form-control"
                    value="{{ profile_user.full_name }}"
                    maxlength="100"
                    placeholder="Enter your full name"
                >

            </div>


            <!-- =========================================
                 BIO
            ========================================== -->

            <div class="form-group">

                <label
                    for="bio"
                    class="form-label"
                >

                    Bio

                </label>


                <textarea
                    name="bio"
                    id="bio"
                    class="form-control"
                    maxlength="150"
                    placeholder="Tell people about yourself..."
                >{{ profile_user.bio }}</textarea>


                <span class="help-text">

                    Maximum 150 characters

                </span>

            </div>


            <!-- =========================================
                 BUTTONS
            ========================================== -->

            <div class="buttons">


                <a
                    href="{% url 'profile' %}"
                    class="cancel-button"
                >

                    Cancel

                </a>


                <button
                    type="submit"
                    class="save-button"
                >

                    <i class="fa-solid fa-check"></i>

                    &nbsp;

                    Save Changes

                </button>


            </div>


        </form>


    </div>


</div>


<!-- ===================================================
     IMAGE PREVIEW
=================================================== -->

<script>

    const imageInput =
        document.getElementById(
            'profile_picture'
        );


    const preview =
        document.getElementById(
            'preview'
        );


    const defaultPreview =
        document.getElementById(
            'defaultPreview'
        );


    imageInput.addEventListener(
        'change',
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(e) {


                    preview.src =
                        e.target.result;


                    preview.style.display =
                        'block';


                    if (defaultPreview) {

                        defaultPreview.style.display =
                            'none';

                    }

                };


            reader.readAsDataURL(file);

        }
    );

</script>


</body>

</html>
